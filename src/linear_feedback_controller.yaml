linear_feedback_controller:
  chainable_controller:
    command_interfaces: {
      type: "string_array",
      description: "Names of the downstream controller that takes the robot state as references.",
    }
    reference_prefix: {
      type: "string",
      description: "Names of the downstream controller that takes the robot state as references.",
      default_value: ""
    }
  remove_gravity_compensation_effort: {
    type: bool,
    description: "Do we need to remove the gravity compensation effort? In practice some robot (like the Panda robot) drivers take as input effort and sum them with the gravity compensation effort. So we need to remove this component to our computed effort in our controller.",
  }
  joint_velocity_filter_coefficient: {
    type: double,
    default_value: 0.9,
    description: "Specifies the filter coefficient for the sensor's exponential filter. If equal to 1 the filter is inactive. I equal to zero the filter crash the signal into a constant being the initial value of the signal.",
    validation: {
      bounds<>: [0.0, 1.0]
    }
  }
  moving_joint_names: {
    type: string_array,
    description: "list of active joint names used by the controller.",
    validation: { not_empty<>: [] }
  }
  __map_moving_joint_names: {
    p: {
      type: double,
      description: "Proportional gains for the PD controller.",
      validation: { gt_eq<>: 0.0 }
    },
    d: {
      type: double,
      description: "Derivation gains for the PD controller.",
      validation: { gt_eq<>: 0.0 }
    }
  }
  robot_has_free_flyer: {
    type: bool,
    description: "Has the robot a freeflyer or not?",
  }
  pd_to_lf_transition_duration: {
    type: double,
    description: "Duration **in seconds** of transition between the PD and the LF controllers.",
    validation: {
      gt_eq<>: 0.0
    }
  }
  reference_interpolation: {
    type: bool,
    default_value: false,
    description: "MPC command-delay compensation (Subburaman & Stasse, Humanoids 2024). When true, the feedback reference (control.initial_state) is linearly interpolated across the MPC cycle between the received knot and the next knot published on the `mpc_x_next` topic (a linear_feedback_controller_msgs/Sensor, same namespace as `control`), instead of being held constant (which produces the staircase reference and jittery feedback torque). Falls back to holding the reference if no mpc_x_next message is available.",
  }
  mpc_period: {
    type: double,
    default_value: 0.01,
    description: "MPC solve period in seconds, used to normalise the interpolation factor for reference_interpolation. Must match the upstream MPC node's dt.",
    validation: { gt<>: 0.0 }
  }
  feedback_lowpass_cutoff_hz: {
    type: double,
    default_value: 0.0,
    description: "2nd-order Butterworth low-pass cutoff (Hz) applied to the feedback torque u_fb = K*(x - x_ref) before adding the feedforward. 0 disables it. Paired with reference_interpolation this is the paper's u3 policy; the paper reports the filter is a minor improvement once the interpolation is in.",
    validation: { gt_eq<>: 0.0 }
  }
