linear_feedback_controller:
  chainable_controller:
    command_interfaces: {
      type: "string_array",
      description: "Names of the downstream controller that takes the robot state as references.",
    }
    reference_prefix: {
      type: "string",
      description: "Names of the downstream controller that takes the robot state as references.",
      default_value: ""
    }
  remove_gravity_compensation_effort: {
    type: bool,
    description: "Do we need to remove the gravity compensation effort? In practice some robot (like the Panda robot) drivers take as input effort and sum them with the gravity compensation effort. So we need to remove this component to our computed effort in our controller.",
  }
  joint_velocity_filter_coefficient: {
    type: double,
    default_value: 0.9,
    description: "Specifies the filter coefficient for the sensor's exponential filter. If equal to 1 the filter is inactive. I equal to zero the filter crash the signal into a constant being the initial value of the signal.",
    validation: {
      bounds<>: [0.0, 1.0]
    }
  }
  moving_joint_names: {
    type: string_array,
    description: "list of active joint names used by the controller.",
    validation: { not_empty<>: [] }
  }
  __map_moving_joint_names: {
    p: {
      type: double,
      description: "Proportional gains for the PD controller.",
      validation: { gt_eq<>: 0.0 }
    },
    d: {
      type: double,
      description: "Derivation gains for the PD controller.",
      validation: { gt_eq<>: 0.0 }
    }
  }
  robot_has_free_flyer: {
    type: bool,
    description: "Has the robot a freeflyer or not?",
  }
  pd_to_lf_transition_duration: {
    type: double,
    description: "Duration **in seconds** of transition between the PD and the LF controllers.",
    validation: {
      gt_eq<>: 0.0
    }
  }
  contact_force_feedback:
    n_directions: {
      type: int,
      default_value: 0,
      description: "Number of contact-force directions appended to the feedback state. 0 (default) = plain [q, v] feedback, unchanged behaviour. n > 0 enables the augmented Riccati force channel: the received feedback_gain is expected to be joint_nv x (2*nv + n) and its last n columns are applied to (f0 - f_measured), where f0 comes from Control.initial_state.contacts and f_measured from the live measured_topic.",
      validation: { gt_eq<>: 0 }
    }
    contact_name: {
      type: string,
      default_value: "",
      description: "Name of the Contact entry (in Control.initial_state.contacts and in the measured_topic Sensor) whose wrench feeds the force channel. Required when n_directions > 0.",
    }
    wrench_indices: {
      type: int_array,
      default_value: [],
      description: "Which components of the 6D contact wrench [fx, fy, fz, tx, ty, tz] feed the force channel, in order. Length must equal n_directions. e.g. [2] for a 1D contact along the contact-frame z axis.",
    }
    measured_topic: {
      type: string,
      default_value: "sensor_with_force",
      description: "Topic (linear_feedback_controller_msgs/Sensor) carrying the live, gravity-compensated, filtered contact wrench and the contact.active flag.",
    }
    activation_time_constant: {
      type: double,
      default_value: 0.05,
      description: "First-order time constant (seconds) smoothing the [0, 1] blend that gates the force channel on contact.active. 0 = hard on/off.",
      validation: { gt_eq<>: 0.0 }
    }
